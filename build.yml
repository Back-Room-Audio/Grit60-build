name: Build Grit60

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: Mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DGRIT_COPY_AFTER_BUILD=OFF

      - name: Configure (Mac, Intel + Apple Silicon)
        if: runner.os == 'macOS'
        run: cmake -B build -DGRIT_COPY_AFTER_BUILD=OFF -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Grit60-${{ matrix.name }}
          path: |
            build/Grit60_artefacts/Release/VST3
            build/Grit60_artefacts/Release/AU
            build/Grit60_artefacts/Release/Standalone
